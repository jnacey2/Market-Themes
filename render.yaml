databases:
  - name: themes-postgres
    databaseName: market_themes
    user: market_themes
    plan: basic-256mb

services:
  - type: web
    name: themes-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build --workspace @market-themes/web
    startCommand: npm run start --workspace @market-themes/web
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v1
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: "MarketThemesBot/0.1"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"
      - key: FMP_API_KEY
        sync: false

  - type: worker
    name: themes-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v1
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: "MarketThemesBot/0.1"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_BACKFILL_MONTHS
        value: "12"
      - key: SEC_BACKFILL_BATCH_SIZE
        value: "10"
      - key: SEC_BACKFILL_BATCH_INDEX
        value: "0"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"
      - key: FMP_API_KEY
        sync: false
      - key: FMP_BACKFILL_QUARTERS
        value: "8"
      - key: FMP_BACKFILL_BATCH_SIZE
        value: "10"
      - key: FMP_BACKFILL_BATCH_INDEX
        value: "0"
      - key: FMP_RATE_LIMIT_MS
        value: "250"

  - type: cron
    name: poll-sources
    runtime: node
    schedule: "*/30 * * * *"
    buildCommand: npm install
    startCommand: npm run poll:sources --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v1
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"

  - type: cron
    name: poll-fmp-transcripts
    runtime: node
    schedule: "30 6 * * 1-6"
    buildCommand: npm install
    startCommand: npm run fmp:poll --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: FMP_API_KEY
        sync: false
      - key: FMP_RATE_LIMIT_MS
        value: "250"

  - type: cron
    name: generate-daily-brief
    runtime: node
    schedule: "0 11 * * 1-5"
    buildCommand: npm install
    startCommand: npm run brief:daily --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: recompute-theme-trends
    runtime: node
    schedule: "15 */4 * * *"
    buildCommand: npm install
    startCommand: npm run trends:recompute --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: TREND_LOOKBACK_DAYS
        value: "120"
      - key: TREND_LOW_HISTORY_DAYS
        value: "14"
