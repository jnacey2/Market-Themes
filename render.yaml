databases:
  - name: themes-postgres
    databaseName: market_themes
    user: market_themes
    plan: basic-256mb

services:
  - type: web
    name: themes-web
    runtime: node
    plan: starter
    buildCommand: npm ci --no-audit --no-fund && npm run build --workspace @market-themes/web
    # Pre-deploy runs on a separate instance that often cannot resolve the
    # internal Postgres hostname (dpg-… with no *.region-postgres.render.com
    # suffix). Retries plus --allow-unresolved-host keep a DNS miss from
    # cancelling the release; start applies the same idempotent schema on
    # the private network. This is not a database-plan issue.
    preDeployCommand: npm run db:apply:predeploy
    startCommand: npm run db:apply && npm run start --workspace @market-themes/web
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: NARRATIVE_PROMOTION_VALIDATION_MODEL
        value: claude-haiku-4-5-20251001
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "25"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "1"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_EXTRACTION_MAX_RUNTIME_MS
        value: "3000000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: BACKFILL_WORKER_POLL_INTERVAL_MS
        value: "45000"
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: NARRATIVE_CLASSIFICATION_PROMPT_VERSION
        value: narrative_classification_v7
      - key: NARRATIVE_DISCOVERY_PROMPT_VERSION
        value: narrative_discovery_v1
      - key: NARRATIVE_CANDIDATE_EVIDENCE_WINDOW_DAYS
        value: "30"
      - key: NARRATIVE_EVENT_TTL_DAYS
        value: "14"
      - key: NARRATIVE_TREND_LOOKBACK_DAYS
        value: "365"
      - key: NARRATIVE_TREND_LOW_HISTORY_DAYS
        value: "14"
      # The /ingestion operations panel counts the classification backlog with
      # the same rules as the classify-narratives cron; keep these in step.
      - key: NARRATIVE_CLASSIFICATION_LOOKBACK_DAYS
        value: "365"
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUBSTACK_STORAGE_STATE_B64
        sync: false
      - key: OPS_USERNAME
        value: operator
      - key: OPS_PASSWORD
        generateValue: true
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: "MarketThemesBot/0.1"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"
      - key: FMP_API_KEY
        sync: false
      - key: FMP_NEWS_LOOKBACK_HOURS
        value: "6"
      - key: FMP_NEWS_MACRO_PROXIES
        value: "SPY,QQQ,TLT,GLD"
      - key: FMP_NEWS_LIMIT
        value: "50"
      - key: FMP_NEWS_RATE_LIMIT_MS
        value: "250"

  - type: worker
    name: themes-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "25"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "1"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: BACKFILL_WORKER_POLL_INTERVAL_MS
        value: "45000"
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SUBSTACK_STORAGE_STATE_B64
        sync: false
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: "MarketThemesBot/0.1"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_BACKFILL_MONTHS
        value: "12"
      - key: SEC_BACKFILL_BATCH_SIZE
        value: "10"
      - key: SEC_BACKFILL_BATCH_INDEX
        value: "0"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"
      - key: TARGET_UNIVERSE
        value: sp500
      - key: FMP_API_KEY
        sync: false
      - key: FMP_BACKFILL_QUARTERS
        value: "8"
      - key: FMP_NEWS_LOOKBACK_HOURS
        value: "6"
      - key: FMP_NEWS_MACRO_PROXIES
        value: "SPY,QQQ,TLT,GLD"
      - key: FMP_NEWS_LIMIT
        value: "50"
      - key: FMP_NEWS_RATE_LIMIT_MS
        value: "250"
      - key: FMP_NEWS_BACKFILL_DAYS
        value: "30"
      - key: FMP_NEWS_BACKFILL_BATCH_SIZE
        value: "20"
      - key: FMP_NEWS_BACKFILL_BATCH_INDEX
        value: "0"
      - key: FMP_BACKFILL_BATCH_SIZE
        value: "10"
      - key: FMP_BACKFILL_BATCH_INDEX
        value: "0"
      - key: FMP_RATE_LIMIT_MS
        value: "250"

  - type: cron
    name: poll-sources
    runtime: node
    schedule: "*/30 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run poll:sources --workspace @market-themes/workers
    # Ingestion only: no model calls happen here, so no Anthropic/Claude config.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SUBSTACK_STORAGE_STATE_B64
        sync: false
      - key: SUBSTACK_REFRESH
        value: "false"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: MarketThemesBot/1.0 (+https://themes-web.onrender.com)
      - key: RSS_LOOKBACK_HOURS
        value: "48"
      - key: SEC_USER_AGENT
        sync: false
      - key: TARGET_UNIVERSE
        value: sp500
      - key: FMP_API_KEY
        sync: false
      - key: FMP_NEWS_LOOKBACK_HOURS
        value: "6"
      - key: FMP_NEWS_MACRO_PROXIES
        value: "SPY,QQQ,TLT,GLD"
      - key: FMP_NEWS_LIMIT
        value: "50"
      - key: FMP_NEWS_RATE_LIMIT_MS
        value: "250"
      - key: GDELT_ENABLED
        value: "false"
      - key: GDELT_DOMAINS
        value: "wsj.com,nytimes.com,bloomberg.com,washingtonpost.com,ft.com,reuters.com"
      - key: NYT_API_KEY
        sync: false
      - key: NYT_SEARCH_LOOKBACK_HOURS
        value: "24"
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"

  - type: cron
    name: extract-recent-signals
    runtime: node
    schedule: "35 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run claude:extract:batch --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_LOOKBACK_DAYS
        value: "30"
      - key: CLAUDE_EXTRACTION_MAX_RUNTIME_MS
        value: "3000000"
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "10"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "10"
      - key: CLAUDE_EXTRACTION_MAX_DOCUMENTS
        value: "100"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: DB_QUERY_TIMEOUT_MS
        value: "120000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384

  - type: cron
    name: poll-fmp-transcripts
    runtime: node
    schedule: "30 6 * * 1-6"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run fmp:poll --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: FMP_API_KEY
        sync: false
      - key: TARGET_UNIVERSE
        value: sp500
      - key: FMP_RATE_LIMIT_MS
        value: "250"

  - type: cron
    name: generate-daily-brief
    runtime: node
    schedule: "40 11 * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run brief:daily --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: NARRATIVE_CLASSIFICATION_PROMPT_VERSION
        value: narrative_classification_v7

  # Corpus-level attention bursts: no model calls; feeds the discovery watchlist and
  # discovery prompt hints. Runs before each discovery window.
  - type: cron
    name: detect-attention-bursts
    runtime: node
    schedule: "35 */6 * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run narratives:bursts --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: DB_QUERY_TIMEOUT_MS
        value: "120000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384

  - type: cron
    name: recompute-theme-trends
    runtime: node
    schedule: "15 */4 * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run themes:normalize:backfill --workspace @market-themes/workers && npm run trends:recompute --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: TREND_LOOKBACK_DAYS
        value: "365"
      - key: TREND_LOW_HISTORY_DAYS
        value: "30"
      # Readers use at most 30 points of history; 45 days keeps a margin while
      # halving the rows the four-hourly rewrite has to delete and insert.
      - key: TREND_STORAGE_DAYS
        value: "45"
      - key: TREND_INSERT_BATCH_SIZE
        value: "250"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DB_QUERY_TIMEOUT_MS
        value: "120000"
      - key: THEME_NORMALIZATION_QUERY_TIMEOUT_MS
        value: "120000"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: THEME_NORMALIZATION_MAX_BATCHES
        value: "20"

  - type: cron
    name: classify-narratives
    runtime: node
    schedule: "5 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run narratives:classify:batch --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_PROMPT_CACHING
        value: "true"
      - key: DB_QUERY_TIMEOUT_MS
        value: "120000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Up to three provider batches in flight; a single slow Anthropic batch
      # (2-3 hours observed) otherwise skips every following hourly submit.
      - key: ANTHROPIC_BATCH_MAX_ACTIVE
        value: "3"
      - key: NARRATIVE_CLASSIFICATION_PROMPT_VERSION
        value: narrative_classification_v7
      # Matches NARRATIVE_TREND_LOOKBACK_DAYS so trend baselines can accumulate a
      # full year of classified history; the 30d window needs 75 days before it
      # leaves low-history state.
      - key: NARRATIVE_CLASSIFICATION_LOOKBACK_DAYS
        value: "365"
      - key: NARRATIVE_CLASSIFICATION_BATCH_SIZE
        value: "10"
      # Upper bound per hourly batch. Each hourly run submits only when the
      # previous batch has completed, and 600-document batches took 1-2 hours
      # at Anthropic (5 of 10 hourly runs skipped overnight on Sep 3-4) while
      # 300-400 complete within the hour, so a smaller cap gives higher
      # sustained throughput and keeps the :25/:55 recomputes fed.
      - key: NARRATIVE_CLASSIFICATION_MAX_DOCUMENTS
        value: "400"
      # Recent documents are claimed newest-first across all source classes
      # before any backfill work, so the measured window is never starved.
      - key: NARRATIVE_CLASSIFICATION_PRIORITY_DAYS
        value: "14"
      - key: NARRATIVE_CLASSIFICATION_MAX_RUNTIME_MS
        value: "2400000"
      - key: NARRATIVE_CLASSIFICATION_CONCURRENCY
        value: "2"
      - key: NARRATIVE_CLASSIFICATION_DOCUMENT_TIMEOUT_MS
        value: "600000"

  - type: cron
    name: discover-narratives
    runtime: node
    schedule: "10 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run narratives:discover:batch --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_PROMPT_CACHING
        value: "true"
      - key: DB_QUERY_TIMEOUT_MS
        value: "120000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: ANTHROPIC_BATCH_MAX_ACTIVE
        value: "3"
      - key: NARRATIVE_DISCOVERY_PROMPT_VERSION
        value: narrative_discovery_v1
      - key: NARRATIVE_DISCOVERY_BATCH_SIZE
        value: "10"
      # Eligible inflow is ~60 documents/hour; a batch of 100 keeps pace and
      # drains backlog. The hourly run skips submission while the previous
      # batch is still in progress, so batch size (not schedule) is the lever.
      - key: NARRATIVE_DISCOVERY_MAX_DOCUMENTS
        value: "100"
      - key: NARRATIVE_DISCOVERY_MAX_RUNTIME_MS
        value: "1200000"
      - key: NARRATIVE_DISCOVERY_CONCURRENCY
        value: "2"
      - key: NARRATIVE_DISCOVERY_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: NARRATIVE_DISCOVERY_LOOKBACK_DAYS
        value: "30"
      - key: NARRATIVE_DISCOVERY_MAX_ATTEMPTS
        value: "5"
      - key: NARRATIVE_DISCOVERY_STALE_MINUTES
        value: "90"
      - key: NARRATIVE_CANDIDATE_EVIDENCE_WINDOW_DAYS
        value: "30"

  - type: cron
    name: poll-anthropic-batches
    runtime: node
    schedule: "2,12,22,32,42,52 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run anthropic:batches:poll --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=384

  - type: cron
    name: auto-review-narratives
    runtime: node
    schedule: "15,45 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run narratives:auto-review --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: NARRATIVE_PROMOTION_VALIDATION_MODEL
        value: claude-haiku-4-5-20251001
      - key: NARRATIVE_CLASSIFICATION_PROMPT_VERSION
        value: narrative_classification_v7
      - key: NARRATIVE_DISCOVERY_PROMPT_VERSION
        value: narrative_discovery_v1
      - key: NARRATIVE_AUTO_REVIEW_ENABLED
        value: "true"
      - key: NARRATIVE_AUTO_REVIEW_MIN_SCORE
        value: "90"
      - key: NARRATIVE_AUTO_REVIEW_MIN_DOCUMENTS
        value: "2"
      - key: NARRATIVE_AUTO_REVIEW_MIN_PUBLISHER_OWNERS
        value: "2"
      - key: NARRATIVE_AUTO_REVIEW_LOOKBACK_DAYS
        value: "7"
      - key: NARRATIVE_AUTO_REVIEW_EXCLUDED_PUBLISHER_OWNERS
        value: youtube,youtube-com,youtube.com,youtu.be
      - key: NARRATIVE_AUTO_REVIEW_STRUCTURAL_MIN_SCORE
        value: "70"
      - key: NARRATIVE_AUTO_REVIEW_STRUCTURAL_MIN_DOCUMENTS
        value: "2"
      - key: NARRATIVE_AUTO_REVIEW_STRUCTURAL_MIN_PUBLISHER_OWNERS
        value: "2"
      - key: NARRATIVE_AUTO_REVIEW_STRUCTURAL_LOOKBACK_DAYS
        value: "14"
      - key: NARRATIVE_AUTO_PROMOTE_CANDIDATES
        value: "true"
      - key: NARRATIVE_AUTO_PROMOTE_MIN_SCORE
        value: "90"
      - key: NARRATIVE_AUTO_PROMOTE_MIN_DOCUMENTS
        value: "3"
      - key: NARRATIVE_AUTO_PROMOTE_MIN_SPAN_DAYS
        value: "7"
      - key: NARRATIVE_AUTO_PROMOTE_ATTACH_MIN_SHARE
        value: "0.5"
      - key: NARRATIVE_AUTO_PROMOTE_MIN_PUBLISHER_OWNERS
        value: "3"
      - key: NARRATIVE_AUTO_PROMOTE_LOOKBACK_DAYS
        value: "7"
      - key: NARRATIVE_AUTO_PROMOTE_MAX_CANDIDATES
        value: "5"
      - key: NARRATIVE_EVENT_TTL_DAYS
        value: "14"
      - key: NARRATIVE_ACTIVATION_MIN_STORIES
        value: "3"
      - key: NARRATIVE_ACTIVATION_MIN_PUBLISHER_OWNERS
        value: "3"
      - key: NARRATIVE_ACTIVATION_LOOKBACK_DAYS
        value: "7"
      - key: NARRATIVE_PROMOTION_VALIDATION_PROMPT_VERSION
        value: candidate_promotion_validation_v2
      - key: NARRATIVE_PROMOTION_VALIDATION_MAX_EVIDENCE
        value: "10"
      - key: NARRATIVE_PROMOTION_VALIDATION_MAX_TOKENS
        value: "2500"

  - type: cron
    name: recompute-narrative-trends
    runtime: node
    schedule: "25,55 * * * *"
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run narrative-trends:recompute --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      # Batch job on a 30-minute cadence: the observation load reads every
      # current-version observation and its document, which can exceed two
      # minutes on the production plan while autovacuum or the theme recompute
      # is running. Five minutes still fits comfortably inside the schedule.
      - key: DB_QUERY_TIMEOUT_MS
        value: "300000"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NARRATIVE_CLASSIFICATION_PROMPT_VERSION
        value: narrative_classification_v7
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: NARRATIVE_ACTIVATION_MIN_STORIES
        value: "3"
      - key: NARRATIVE_ACTIVATION_MIN_PUBLISHER_OWNERS
        value: "3"
      - key: NARRATIVE_ACTIVATION_LOOKBACK_DAYS
        value: "7"
      - key: NARRATIVE_TREND_LOOKBACK_DAYS
        value: "365"
      - key: NARRATIVE_TREND_LOW_HISTORY_DAYS
        value: "14"
      # poll-sources inserts at :00/:30, classification claims at :05, and this
      # job runs at :25/:55, so the :55 recompute always sees the :30 documents
      # unclassified. 98% of a ~5,000-document window tolerates ~1.5 hours of
      # inflow while a genuine backlog still reads as pending.
      - key: NARRATIVE_COVERAGE_MEASURED_PERCENT
        value: "98"

