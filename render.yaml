databases:
  - name: themes-postgres
    databaseName: market_themes
    user: market_themes
    plan: basic-256mb

services:
  - type: web
    name: themes-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build --workspace @market-themes/web
    preDeployCommand: npm run db:apply
    startCommand: npm run start --workspace @market-themes/web
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "25"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "1"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: BACKFILL_WORKER_POLL_INTERVAL_MS
        value: "45000"
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPS_USERNAME
        value: operator
      - key: OPS_PASSWORD
        generateValue: true
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: "MarketThemesBot/0.1"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"
      - key: FMP_API_KEY
        sync: false
      - key: FMP_NEWS_LOOKBACK_HOURS
        value: "6"
      - key: FMP_NEWS_MACRO_PROXIES
        value: "SPY,QQQ,TLT,GLD"
      - key: FMP_NEWS_LIMIT
        value: "50"
      - key: FMP_NEWS_RATE_LIMIT_MS
        value: "250"

  - type: worker
    name: themes-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "25"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "1"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: BACKFILL_WORKER_POLL_INTERVAL_MS
        value: "45000"
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SCRAPER_USER_AGENT
        value: "MarketThemesBot/0.1"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_BACKFILL_MONTHS
        value: "12"
      - key: SEC_BACKFILL_BATCH_SIZE
        value: "10"
      - key: SEC_BACKFILL_BATCH_INDEX
        value: "0"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"
      - key: FMP_API_KEY
        sync: false
      - key: FMP_BACKFILL_QUARTERS
        value: "8"
      - key: FMP_NEWS_LOOKBACK_HOURS
        value: "6"
      - key: FMP_NEWS_MACRO_PROXIES
        value: "SPY,QQQ,TLT,GLD"
      - key: FMP_NEWS_LIMIT
        value: "50"
      - key: FMP_NEWS_RATE_LIMIT_MS
        value: "250"
      - key: FMP_NEWS_BACKFILL_DAYS
        value: "30"
      - key: FMP_NEWS_BACKFILL_BATCH_SIZE
        value: "20"
      - key: FMP_NEWS_BACKFILL_BATCH_INDEX
        value: "0"
      - key: FMP_BACKFILL_BATCH_SIZE
        value: "10"
      - key: FMP_BACKFILL_BATCH_INDEX
        value: "0"
      - key: FMP_RATE_LIMIT_MS
        value: "250"

  - type: cron
    name: poll-sources
    runtime: node
    schedule: "*/30 * * * *"
    buildCommand: npm install
    startCommand: npm run poll:sources --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_DOCUMENT_LIMIT
        value: "20"
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "25"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "1"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: SOURCE_CONFIG_JSON
        value: "{}"
      - key: SCRAPING_ENABLED
        value: "false"
      - key: SEC_USER_AGENT
        sync: false
      - key: SEC_POLL_LOOKBACK_DAYS
        value: "7"
      - key: SEC_RATE_LIMIT_MS
        value: "220"
      - key: SEC_INCLUDE_CORE_FORMS
        value: "true"
      - key: SEC_INCLUDE_PROXY_FORMS
        value: "true"
      - key: SEC_INCLUDE_CAPITAL_MARKETS_FORMS
        value: "true"
      - key: SEC_INCLUDE_OWNERSHIP_FORMS
        value: "true"
      - key: SEC_INCLUDE_STRESS_FORMS
        value: "true"
      - key: SEC_INCLUDE_8K_EXHIBITS
        value: "true"
      - key: SEC_INCLUDE_STRUCTURED_OWNERSHIP_FORMS
        value: "false"

  - type: cron
    name: poll-fmp-transcripts
    runtime: node
    schedule: "30 6 * * 1-6"
    buildCommand: npm install
    startCommand: npm run fmp:poll --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: FMP_API_KEY
        sync: false
      - key: FMP_RATE_LIMIT_MS
        value: "250"

  - type: cron
    name: generate-daily-brief
    runtime: node
    schedule: "0 11 * * 1-5"
    buildCommand: npm install
    startCommand: npm run brief:daily --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: recompute-theme-trends
    runtime: node
    schedule: "15 */4 * * *"
    buildCommand: npm install
    startCommand: npm run pipeline --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: TREND_LOOKBACK_DAYS
        value: "365"
      - key: TREND_LOW_HISTORY_DAYS
        value: "30"
      - key: TREND_STORAGE_DAYS
        value: "90"
      - key: TREND_INSERT_BATCH_SIZE
        value: "250"
      - key: PIPELINE_SKIP_INGEST
        value: "true"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: CLAUDE_PROMPT_VERSION
        value: market_signal_extraction_v2
      - key: CLAUDE_EXTRACTION_BATCH_SIZE
        value: "25"
      - key: CLAUDE_EXTRACTION_MAX_BATCHES
        value: "4"
      - key: CLAUDE_EXTRACTION_CONCURRENCY
        value: "2"
      - key: CLAUDE_EXTRACTION_DOCUMENT_TIMEOUT_MS
        value: "600000"
      - key: CLAUDE_STALE_RUN_MINUTES
        value: "90"
      - key: CLAUDE_ANALYSIS_MAX_ATTEMPTS
        value: "5"
      - key: CLAUDE_MAX_EVIDENCE_CHARS
        value: "800"
      - key: CLAUDE_EXCLUDED_SEC_CATEGORIES
        value: capital_markets
      - key: THEME_NORMALIZATION_PROMPT_VERSION
        value: theme_normalization_v3
      - key: THEME_NORMALIZATION_BATCH_SIZE
        value: "25"
      - key: THEME_NORMALIZATION_MAX_BATCHES
        value: "20"
      - key: NARRATIVE_CLASSIFICATION_PROMPT_VERSION
        value: narrative_classification_v1
      - key: NARRATIVE_CLASSIFICATION_BATCH_SIZE
        value: "10"
      - key: NARRATIVE_CLASSIFICATION_MAX_BATCHES
        value: "4"

  - type: cron
    name: poll-fmp-news
    runtime: node
    schedule: "0 */6 * * *"
    buildCommand: npm install
    startCommand: npm run fmp:news:poll --workspace @market-themes/workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: themes-postgres
          property: connectionString
      - key: FMP_API_KEY
        sync: false
      - key: FMP_NEWS_LOOKBACK_HOURS
        value: "6"
      - key: FMP_NEWS_MACRO_PROXIES
        value: "SPY,QQQ,TLT,GLD"
      - key: FMP_NEWS_LIMIT
        value: "50"
      - key: FMP_NEWS_RATE_LIMIT_MS
        value: "250"
